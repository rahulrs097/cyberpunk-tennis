# Deploy with:  npx wrangler deploy   (from this folder, on a free Cloudflare account)
name = "cyberpunk-tennis-relay"
main = "relay.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones the free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
