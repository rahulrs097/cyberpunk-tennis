<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a1260"/>
      <stop offset="0.55" stop-color="#0e0a26"/>
      <stop offset="1" stop-color="#05040c"/>
    </radialGradient>
    <radialGradient id="ball" cx="40%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f6ffb0"/>
      <stop offset="0.45" stop-color="#e4ff4a"/>
      <stop offset="1" stop-color="#7fa000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ballClip"><circle cx="256" cy="226" r="112"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- court lines running away to the horizon -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M40 470 L196 346 M472 470 L316 346" stroke="#25d9ff" stroke-width="7"/>
    <path d="M196 346 L316 346" stroke="#25d9ff" stroke-width="6"/>
    <path d="M256 346 L256 470" stroke="#25d9ff" stroke-width="5" opacity="0.7"/>
    <path d="M118 408 L394 408" stroke="#ff3fb4" stroke-width="7"/>
  </g>
  <!-- the ball, with a pink and cyan rim light -->
  <circle cx="256" cy="226" r="122" fill="none" stroke="#ff3fb4" stroke-width="8" filter="url(#glow)" opacity="0.9"/>
  <circle cx="256" cy="226" r="112" fill="url(#ball)" filter="url(#soft)"/>
  <g clip-path="url(#ballClip)" fill="none" stroke="#fbfff0" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <path d="M150 140 C 220 185, 220 270, 150 316"/>
    <path d="M362 136 C 292 181, 292 266, 362 312"/>
  </g>
  <circle cx="256" cy="226" r="112" fill="none" stroke="#25d9ff" stroke-width="4" opacity="0.55"/>
</svg>
