# One Cloudflare Worker serves the game (static files in this folder) and
# the online-play relay (server/relay.js) at /room/<CODE>.
# Cloudflare deploys it from this repo on every push to main.
name = "cyberpunk-tennis"
main = "server/relay.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/room/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones the free plan allows
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
